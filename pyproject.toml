[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-ctf-merge-bot"
version = "0.1.0"
description = "Arbitrage bot for Polymarket CTF Merge (YES+NO -> pUSD)"
requires-python = ">=3.11"
dependencies = [
    "web3>=6.0.0",
    "py-clob-client>=0.6.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "aiosqlite>=0.20.0",
    "python-json-logger>=2.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]